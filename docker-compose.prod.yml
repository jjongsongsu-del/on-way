services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-/api/v1}
    container_name: badagil-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${SEA_LOAD_PORT:-8082}:80"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: badagil-api
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-badagil}:${POSTGRES_PASSWORD:-badagil}@postgres:5432/${POSTGRES_DB:-badagil}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    expose:
      - "4000"

  postgres:
    image: postgres:17-alpine
    container_name: badagil-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-badagil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-badagil}
      POSTGRES_DB: ${POSTGRES_DB:-badagil}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:8-alpine
    container_name: badagil-redis-prod
    restart: unless-stopped
    volumes:
      - redis-prod-data:/data
    expose:
      - "6379"

volumes:
  postgres-prod-data:
  redis-prod-data:
