// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

subprojects { subproject ->
  subproject.plugins.withId("com.android.library") {
    subproject.android.defaultConfig.externalNativeBuild.cmake.arguments "-DCMAKE_SUPPRESS_REGENERATION=ON", "-DCMAKE_OBJECT_PATH_MAX=128"
  }

  subproject.tasks.configureEach { task ->
    if (task.name.startsWith("buildCMake")) {
      task.doFirst {
        def moduleRoot = subproject.projectDir.parentFile?.absolutePath ?: subproject.projectDir.absolutePath
        def encodedModuleRoot = moduleRoot.replaceFirst(/^([A-Za-z]):/, '$1_').replace('\\', '/')
        def cxxDir = new File(subproject.projectDir, ".cxx")

        if (cxxDir.exists()) {
          cxxDir.eachDirRecurse { dir ->
            if (dir.name.endsWith(".dir") && dir.parentFile?.name == "CMakeFiles") {
              new File(dir, encodedModuleRoot).mkdirs()
              new File(dir, "${encodedModuleRoot}/cpp").mkdirs()
              new File(dir, "${encodedModuleRoot}/common/cpp").mkdirs()
              new File(dir, "${encodedModuleRoot}/src/main/cpp").mkdirs()
            }
          }
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
