// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

subprojects { subproject ->
  subproject.plugins.withId("com.android.library") {
    subproject.android.defaultConfig.externalNativeBuild.cmake.arguments "-DCMAKE_SUPPRESS_REGENERATION=ON"
  }

  if (subproject.name == "react-native-screens") {
    subproject.tasks.configureEach { task ->
      if (task.name.startsWith("buildCMake")) {
        task.doFirst {
          def cxxDir = new File(subproject.projectDir, ".cxx")
          if (cxxDir.exists()) {
            cxxDir.eachDirRecurse { dir ->
              if (dir.name == "rnscreens.dir" && dir.parentFile?.name == "CMakeFiles") {
                new File(dir, "C_/dev/sea-load/node_modules/.pnpm").mkdirs()
              }
            }
          }
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
