services:
  postgres:
    image: postgres:17-alpine
    container_name: badagil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: badagil
      POSTGRES_PASSWORD: badagil
      POSTGRES_DB: badagil
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: badagil-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:

